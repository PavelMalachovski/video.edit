<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#25E2EE","options":["#25E2EE","#FF4D8D","#B5F23D","#FFD23F"]},"$preview":{"width":390,"height":1380}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#25E2EE';
    return { accent: accent, onAccent: this.ink(accent) };
  }
  ink(hex) {
    const h = String(hex).replace('#', '');
    if (h.length !== 6) return '#06121A';
    const c = [0, 2, 4].map((i) => {
      const v = parseInt(h.slice(i, i + 2), 16) / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2] > 0.18 ? '#06121A' : '#FFFFFF';
  }
}
</script>
