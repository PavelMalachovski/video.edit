<title>Редактор video.edit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Montserrat:wght@800;900&family=Caveat:wght@700&family=Unbounded:wght@800&family=Rubik:wght@800&family=Oswald:wght@700&display=swap">
<style>
/* Раскладка: шапка во всю ширину; слева — рельса инструментов и панель; справа — кадр 9:16 над таймлайном
   (как у veed). Светлая тема выбрана Павлом 12.10 — один светлый вид, цвета заданы явно. */
:root {
  --bg: #F3F4F1; --surface: #FFFFFF; --sunk: #ECEDE9; --hover: #E5E7E2; --line: #DFE1DB; --line-strong: #C9CDC4;
  --ink: #131512; --muted: #5C6159; --faint: #868B82;
  --accent: #C6F04B; --accent-hover: #B5E33A; --accent-ink: #151A06; --accent-soft: #EEF9CF;
  --select: #2E5BFF; --select-soft: rgba(46, 91, 255, .12);
  --stage: #E6E7E3; --frame-bg: #20242B;
  --t-video: #D9E1F3; --t-video-edge: #8EA2D2; --t-voice: #4F82EA; --t-music: #9672E6; --t-sfx: #EB8A33;
  --t-sub: #EFC23A; --t-text: #E2629B; --t-ins: #2FAE95;
  --bad: #D93F44; --ok: #2E8F45; --warn-soft: #FFF4D6; --warn-ink: #6B4A00;
  --ui: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 14px; line-height: 1.35; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--select); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { height: 100%; display: grid; grid-template-columns: 76px 312px minmax(0, 1fr); grid-template-rows: 56px minmax(0, 1fr) auto;
  grid-template-areas: "top top top" "rail panel stage" "rail panel tl"; }

/* ── шапка ── */
.top { grid-area: top; display: flex; align-items: center; gap: 10px; padding-inline: 16px 12px; background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; letter-spacing: -.01em; flex: none; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--ink); display: grid; place-items: center; }
.crumb { display: flex; align-items: center; gap: 4px; min-width: 0; flex: 1; overflow: hidden; padding: 2px; }
.back { height: 36px; padding: 0 10px 0 6px; border: none; border-radius: 8px; background: transparent; display: flex; align-items: center; gap: 2px; color: var(--muted); font-weight: 500; flex: none; }
.back:hover { background: var(--sunk); color: var(--ink); }
.title-input { border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 6px 8px; font-weight: 600; font-size: 15px; min-width: 56px; width: 100%; max-width: 340px; text-overflow: ellipsis; }
.title-input:hover { border-color: var(--line); }
.title-input:focus { border-color: var(--select); outline: none; background: var(--surface); }
.save { font-size: 12px; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 6px; flex: none; }
.save i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); display: inline-block; }
.save.busy i { background: var(--t-sfx); }
.top-tools { display: flex; align-items: center; gap: 6px; flex: none; }
.ibtn { width: 36px; height: 36px; border: none; border-radius: 8px; background: transparent; display: grid; place-items: center; color: var(--ink); flex: none; }
.ibtn:hover { background: var(--sunk); }
.ibtn:disabled { opacity: .35; cursor: default; background: transparent; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: none; background: transparent; border-radius: 7px; padding: 5px 9px; font-size: 12px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.btn { height: 36px; border: none; border-radius: 9px; padding: 0 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.dark { background: var(--ink); color: #fff; }
.btn.dark:hover { background: #2a2d29; }
.btn.soft { background: var(--sunk); }
.btn.soft:hover { background: var(--hover); }
.btn.line { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong); }
.btn.line:hover { background: var(--sunk); }
.btn.small { height: 30px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
.btn.wide { width: 100%; }
.chip-ver { font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-ink); }
.about { height: 30px; border: 1px dashed var(--line-strong); background: transparent; border-radius: 8px; padding: 0 10px; font-size: 12px; color: var(--muted); }
.about:hover { color: var(--ink); border-color: var(--ink); }

/* ── рельса и панель ── */
.rail { grid-area: rail; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 0; overflow-y: auto; }
.rail button { width: 64px; min-height: 56px; border: none; background: transparent; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; color: var(--muted); padding: 6px 2px; }
.rail button svg { width: 20px; height: 20px; }
.rail button:hover { background: var(--sunk); color: var(--ink); }
.rail button[aria-current="true"] { background: var(--sunk); color: var(--ink); font-weight: 600; }
.rail button[aria-current="true"] .ricon { background: var(--accent); }
.ricon { width: 32px; height: 28px; border-radius: 8px; display: grid; place-items: center; }
.rail .gap { flex: 1; }

.panel { grid-area: panel; background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; min-width: 0; }
.pin { padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 16px; }
.pin h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.pin h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.pin p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
.group { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 8px; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.field { width: 100%; border: 1px solid var(--line-strong); border-radius: 9px; padding: 8px 10px; background: var(--surface); }
.field:focus { outline: none; border-color: var(--select); box-shadow: 0 0 0 3px var(--select-soft); }
textarea.field { resize: vertical; min-height: 72px; line-height: 1.4; }
.lbl { font-size: 13px; font-weight: 600; }
.hint { font-size: 12px; color: var(--muted); }
.back-link { border: none; background: transparent; padding: 0; color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; }
.back-link:hover { color: var(--ink); }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; background: var(--sunk); min-width: 0; }
.item .grow b { display: block; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .grow span { font-size: 12px; color: var(--muted); }
.thumb { width: 40px; height: 56px; border-radius: 6px; flex: none; background: var(--frame-bg); display: block; }
.play-mini { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--surface); display: grid; place-items: center; flex: none; }
.toggle { position: relative; width: 38px; height: 22px; border-radius: 11px; border: none; background: var(--line-strong); flex: none; padding: 0; transition: background .15s; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .15s; }
.toggle[aria-pressed="true"] { background: var(--ink); }
.toggle[aria-pressed="true"]::after { left: 19px; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.card.hl { border-color: var(--ink); }
.tip { display: flex; gap: 8px; padding: 10px; border-radius: 10px; background: var(--warn-soft); color: var(--warn-ink); font-size: 13px; align-items: flex-start; }
.variants { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.variant { border: 2px solid transparent; background: var(--frame-bg); border-radius: 10px; aspect-ratio: 9 / 13; padding: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; overflow: hidden; color: #fff; position: relative; }
.variant[aria-pressed="true"] { border-color: var(--select); box-shadow: 0 0 0 2px var(--select-soft); }
.variant .vlabel { position: absolute; top: 6px; left: 6px; font-size: 11px; font-weight: 700; background: rgba(255,255,255,.9); color: var(--ink); border-radius: 5px; padding: 1px 6px; }
.variant .vs { margin-bottom: 18px; font-size: 12px; line-height: 1.1; text-align: center; padding: 0 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.chips button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.chips button:disabled { opacity: .45; cursor: default; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sw { width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(0,0,0,.12); padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
input[type="range"] { width: 100%; accent-color: var(--ink); }
input[type="color"] { -webkit-appearance: none; appearance: none; width: 28px; height: 28px; border: 1px dashed var(--line-strong); padding: 2px; background: none; border-radius: 50%; cursor: pointer; }
input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
input[type="color"]::-moz-color-swatch { border: none; border-radius: 50%; }
.subrow { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 8px; align-items: center; }
.subrow .t { font-size: 12px; color: var(--muted); border: none; background: none; padding: 0; text-align: left; }
.subrow .t:hover { color: var(--select); }
.subrow input.cur { border-color: var(--select); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; }

/* ── сцена ── */
.stage { grid-area: stage; background: var(--stage); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; min-height: 0; min-width: 0; position: relative; }
.frame-wrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
.frame { position: relative; background: var(--frame-bg); border-radius: 6px; overflow: hidden; box-shadow: 0 8px 30px rgba(20, 24, 18, .18); container-type: inline-size; flex: none; }
.frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ov { position: absolute; inset: 0; pointer-events: none; }
.stage-meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; justify-content: center; }
.pill { background: var(--surface); border-radius: 999px; padding: 4px 10px; border: 1px solid var(--line); }

/* слой текста на кадре (в сервисе его рисует template/) */
.sub { position: absolute; left: 6%; right: 6%; top: 64%; text-align: center; font-weight: 900; text-transform: uppercase; font-size: 7.6cqw; line-height: 1.08; color: #fff;
  -webkit-text-stroke: .9cqw #000; paint-order: stroke fill; letter-spacing: .01em; }
.sub .w { display: inline-block; margin: 0 .12em; }
.sub.B { text-transform: none; -webkit-text-stroke: 0; font-size: 6.6cqw; }
.sub.B .box { display: inline; background: rgba(12, 12, 14, .78); padding: .12em .35em; border-radius: .35em; box-decoration-break: clone; -webkit-box-decoration-break: clone; line-height: 1.5; }
.sub.C { font-size: 13cqw; top: 58%; }
.hook { position: absolute; left: 6%; right: 6%; top: 11%; text-align: center; color: #fff; font-weight: 900; font-size: 8.4cqw; line-height: 1.02; text-transform: uppercase; -webkit-text-stroke: .9cqw #000; paint-order: stroke fill; }
.hook .hand { display: block; font-family: "Caveat", cursive; text-transform: none; font-weight: 700; font-size: 15cqw; -webkit-text-stroke: 0; transform: rotate(-4deg); margin-top: -.05em; text-shadow: 0 .6cqw 0 rgba(0,0,0,.55); }
.cta { position: absolute; left: 8%; right: 8%; bottom: 13%; text-align: center; }
.cta span { display: inline-block; background: #fff; color: #111; font-weight: 800; font-size: 5.4cqw; padding: .45em .8em; border-radius: .6em; box-shadow: 0 1cqw 0 rgba(0,0,0,.25); }
.txt { position: absolute; left: 8%; right: 8%; top: 28%; text-align: center; color: #fff; font-weight: 800; font-size: 6cqw; -webkit-text-stroke: .7cqw #000; paint-order: stroke fill; }
.ins { position: absolute; display: grid; place-items: center; }
.ins.sel, .hook.sel, .cta.sel, .txt.sel { outline: 2px dashed #7EA0FF; outline-offset: 4px; }
.flag { width: 100%; aspect-ratio: 3 / 2; position: relative; border-radius: 6%; overflow: hidden; box-shadow: 0 1.2cqw 2.4cqw rgba(0,0,0,.35); transform: rotate(6deg); }
.flag::before { content: ""; position: absolute; inset: 0; background: linear-gradient(#fff 0 50%, #D7141A 50% 100%); }
.flag::after { content: ""; position: absolute; inset: 0; background: #11457E; clip-path: polygon(0 0, 50% 50%, 0 100%); }
.icon-ins { width: 100%; aspect-ratio: 1; border-radius: 22%; background: #fff; display: grid; place-items: center; box-shadow: 0 1.2cqw 2.4cqw rgba(0,0,0,.35); transform: rotate(-5deg); }
.icon-ins svg { width: 58%; height: 58%; }
.bar { position: absolute; left: 0; bottom: 0; height: 1.1cqw; min-height: 3px; }

/* ── таймлайн ── */
.tl { grid-area: tl; background: var(--surface); border-top: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; height: 366px; container-type: inline-size; }
.tl-bar { display: grid; grid-template-columns: minmax(max-content, 1fr) auto minmax(max-content, 1fr); align-items: center; gap: 6px; padding: 6px 12px; border-bottom: 1px solid var(--line); }
.tl-bar .left, .tl-bar .right, .tl-bar .mid { display: flex; align-items: center; gap: 4px; }
.tl-bar .right { justify-content: flex-end; }
.tbtn { height: 32px; border: none; background: transparent; border-radius: 8px; padding: 0 9px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.tbtn:hover { background: var(--sunk); }
.tbtn:disabled { opacity: .35; cursor: default; background: transparent; }
.tbtn kbd { font-family: var(--mono); font-size: 10px; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 4px; }
.playbtn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--ink); color: #fff; display: grid; place-items: center; }
.playbtn:hover { background: #2b2e2a; }
.time { font-size: 12px; color: var(--muted); padding: 0 6px; white-space: nowrap; }
.time b { color: var(--ink); font-weight: 600; }
.tl-bar .zoom { width: 110px; flex: none; }
@container (max-width: 1000px) { .tl-lbl, .tbtn kbd.k-hint { display: none; } .tl-bar .zoom { width: 72px; } }
@container (max-width: 640px) { .tl-bar .zoom { display: none; } }
@container (max-width: 520px) { .keys-btn { display: none !important; } }
@container (max-width: 440px) { .edge-btn { display: none !important; } }
.tl-scroll { flex: 1; overflow: auto; position: relative; min-height: 0; overscroll-behavior-x: contain; scroll-padding-left: var(--hw); scroll-padding-top: 26px; }
.tl-inner { position: relative; min-width: 100%; }
.ruler { position: sticky; top: 0; z-index: 6; height: 26px; display: flex; background: var(--surface); border-bottom: 1px solid var(--line); }
.corner { position: sticky; left: 0; z-index: 7; width: var(--hw); flex: none; background: var(--surface); border-right: 1px solid var(--line); }
.ticks { position: relative; flex: 1; cursor: pointer; touch-action: none; }
.tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line-strong); }
.tick span { position: absolute; top: 5px; left: 4px; font-family: var(--mono); font-size: 10px; color: var(--muted); white-space: nowrap; }
.tick.minor { top: 18px; border-color: var(--line); }
.track { display: flex; border-bottom: 1px solid var(--line); }
.th { position: sticky; left: 0; z-index: 5; width: var(--hw); flex: none; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 0 6px 0 10px; }
.th .row { gap: 4px; }
.th .name { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.th .dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.th .mute { width: 26px; height: 26px; border: none; background: transparent; border-radius: 6px; display: grid; place-items: center; color: var(--muted); margin-left: auto; }
.th .mute:hover { background: var(--sunk); color: var(--ink); }
.th .mute[aria-pressed="true"] { color: var(--bad); }
.th input[type="range"] { height: 14px; }
.lane { position: relative; flex: 1; }
.track.video .lane { height: 64px; }
.track.voice .lane { height: 50px; }
.track.music .lane { height: 38px; }
.track.sfx .lane, .track.subs .lane, .track.text .lane, .track.insr .lane { height: 30px; }
.clip { position: absolute; top: 5px; bottom: 5px; border-radius: 7px; overflow: hidden; cursor: grab; touch-action: pan-x pan-y; user-select: none; }
.clip.sel { touch-action: none; }
.clip.sel { box-shadow: 0 0 0 2px var(--select); z-index: 3; }
.clip:focus-visible { outline: 2px solid var(--select); outline-offset: 1px; z-index: 3; }
.clip .lbl2 { position: absolute; left: 6px; top: 3px; font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100% - 12px); pointer-events: none; }
.clip.v { background: var(--t-video); border: 1px solid var(--t-video-edge); }
.clip.v canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .92; pointer-events: none; }
.clip.v .lbl2 { background: rgba(255,255,255,.88); border-radius: 4px; padding: 0 4px; top: 4px; left: 4px; }
.clip.v.s2 { border-color: #B18A3D; }
.clip.wave { background: rgba(79, 130, 234, .12); border: 1px solid rgba(79, 130, 234, .45); cursor: pointer; }
.clip.wave canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.clip.wave.muted { filter: grayscale(1); opacity: .55; }
.clip.music { background: rgba(150, 114, 230, .16); border: 1px solid rgba(150, 114, 230, .6); }
.clip.music canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.clip.music .lbl2 { color: #4B2E9E; }
.clip.sfx { background: var(--t-sfx); color: #fff; top: 4px; bottom: 4px; border-radius: 6px; }
.clip.subc { background: #FFF3C7; border: 1px solid var(--t-sub); color: #5C4500; top: 4px; bottom: 4px; cursor: pointer; }
.clip.text { background: #FCE1EE; border: 1px solid var(--t-text); color: #8A1E52; top: 4px; bottom: 4px; }
.clip.insc { background: #D6F3EC; border: 1px solid var(--t-ins); color: #11624F; top: 4px; bottom: 4px; }
.clip.subc .lbl2, .clip.text .lbl2, .clip.insc .lbl2, .clip.sfx .lbl2 { top: 50%; transform: translateY(-50%); }
.handle { position: absolute; top: 0; bottom: 0; width: min(9px, 22%); cursor: ew-resize; z-index: 2; }
.handle.l { left: 0; }
.handle.r { right: 0; }
.clip.sel .handle::after { content: ""; position: absolute; top: 50%; transform: translateY(-50%); width: 3px; height: 60%; max-height: 26px; border-radius: 2px; background: var(--select); left: 3px; }
.cutmark { position: absolute; top: 0; bottom: 0; width: 0; z-index: 4; }
.cutmark button { position: absolute; top: -1px; left: -9px; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); display: grid; place-items: center; padding: 0; color: var(--muted); }
.cutmark button:hover { border-color: var(--select); color: var(--select); }
.cutmark::after { content: ""; position: absolute; top: 14px; bottom: 6px; left: -1px; border-left: 2px dotted var(--line-strong); }
.fade { position: absolute; top: 0; bottom: 0; pointer-events: none; }
.playhead { position: absolute; top: 0; bottom: 0; width: 0; z-index: 8; pointer-events: none; }
.playhead::before { content: ""; position: absolute; top: 0; bottom: 0; left: -1px; width: 2px; background: var(--select); }

<script>
(() => {
'use strict';
// ───────── пример ролика: два файла, слова с временем (как words.json), черновик автомонтажа ─────────
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const FILLERS = new Set(['ну', 'вот']);
const bare = (w) => w.toLowerCase().replace(/[^\p{L}\d-]/gu, '');
function buildWords(text, lead, seed) {
  const r = rng(seed); const out = []; let t = lead;
  for (const tok of text.split(/\s+/)) {
    if (tok === '—') { t += 0.42; continue; }
    const letters = tok.replace(/[^\p{L}\d]/gu, '').length;
    const d = 0.15 + 0.05 * letters + r() * 0.05;
    out.push({ w: tok, t0: t, t1: t + d, filler: FILLERS.has(bare(tok)) });
    t += d;
    const last = tok.slice(-1);
    if ('.?!'.includes(last)) t += 0.62 + r() * 0.32;
    else if (last === ',' || last === ':') t += 0.22 + r() * 0.12;
    else t += 0.05 + r() * 0.04;
  }
  return { words: out, end: t + 0.5 };
}
const S1 = buildWords('Три ошибки, из-за которых ты до сих пор не говоришь по-чешски. Первая — ты учишь слова списками. Ну, вот честно, списки забываются через неделю. Учи фразы целиком, сразу в контексте. Вторая — ты боишься ошибаться. Чехи не смеются над акцентом, они радуются, что ты вообще пытаешься. Третья — ты не слушаешь живую речь. Включай подкасты, сериалы, разговоры в трамвае.', 0.9, 7);
const S2 = buildWords('Хочешь список из ста фраз на каждый день? Пиши в комментариях слово «чешский» — и я пришлю его тебе.', 0.7, 11);
const SOURCES = {
  s1: { id: 's1', name: 'IMG_4512.MOV', place: 'улица', placeEn: 'street', dur: S1.end, noise: 0.24, scene: 'street', words: S1.words },
  s2: { id: 's2', name: 'IMG_4520.MOV', place: 'дома', placeEn: 'home', dur: S2.end, noise: 0.05, scene: 'home', words: S2.words },
};
const MUSIC = [
  { id: 'm1', name: 'Утренний лоу-фай', dur: 148, bpm: 84 },
  { id: 'm2', name: 'Пульс города', dur: 121, bpm: 112 },
  { id: 'm3', name: 'Тёплый синт', dur: 96, bpm: 92 },
  { id: 'm4', name: 'Лёгкая гитара', dur: 133, bpm: 100 },
];
const SFX = [{ id: 'whoosh', ru: 'Вжух', en: 'Whoosh' }, { id: 'click', ru: 'Щелчок', en: 'Click' }, { id: 'pop', ru: 'Пузырь', en: 'Pop' }, { id: 'hit', ru: 'Удар', en: 'Hit' }];
const INSERTS = [{ kind: 'flag', ru: 'Флаг Чехии', en: 'Czech flag', hf: 2 / 3 }, { kind: 'mic', ru: 'Подкаст', en: 'Podcast', hf: 1 }, { kind: 'arrow', ru: 'Стрелка', en: 'Arrow', hf: 1 }, { kind: 'check', ru: 'Галочка', en: 'Check mark', hf: 1 }];
const FONTS = ['Montserrat', 'Unbounded', 'Rubik', 'Oswald'];
const HL = ['#FFD60A', '#C6F04B', '#4FD1FF', '#FF6B9A', '#FFFFFF'];
const FPS = 30;
let uid = 1; const nid = (p) => p + (uid++);

function autoCut(src, minPause, dropFillers) {
  const S = SOURCES[src]; const ws = S.words.filter((w) => !(dropFillers && w.filler));
  const segs = []; let cur = null;
  for (const w of ws) {
    if (cur && w.t0 - cur.out <= minPause) cur.out = w.t1;
    else { if (cur) segs.push(cur); cur = { in: w.t0, out: w.t1 }; }
  }
  if (cur) segs.push(cur);
  const out = segs.map((s) => ({ id: nid('c'), src, in: Math.max(0, s.in - 0.08), out: Math.min(S.dur, s.out + 0.06) }));
  for (let i = 1; i < out.length; i++) if (out[i].in < out[i - 1].out) out[i].in = out[i - 1].out;
  return out;
}

// документ (в сервисе — jobs/<id>/timeline.json) и состояние экрана
let doc = {
  speed: 1.1,
  clips: [...autoCut('s1', 0.35, true), ...autoCut('s2', 2, false)],
  voice: { gainDb: 0, muted: false, clean: { on: false, strength: 18 } },
  music: { asset: 'm1', at: 0, in: 12, len: 0, gainDb: -14, muted: false, fadeIn: 0.1, fadeOut: 1, duck: true },
  sfxMuted: false, sfx: [],
  texts: [], inserts: [], subEdits: {},
  style: { variant: 'A', font: 'Montserrat', hl: '#FFD60A', text: '#FFFFFF', bar: '#FFD60A', words: 3 },
  cutPause: 0.35, dropFillers: true, versions: { ad: false, ab: false },
};
const ui = { t: 0, playing: false, pps: 20, sel: null, inspect: false, panel: 'media', lang: 'ru', ab: 'after', noisyDismissed: false,
  rendered: false, rendering: false, ver: 1, rev: 14, guide: null, caret: null, drag: null, lastTotal: null, fixDraft: '', opener: null };
const undo = [], redo = [];
const isPhone = () => window.matchMedia('(max-width: 860px)').matches;

// ───────── время: исходник ↔ финал (в сервисе — TS-перенос engine/vm/timeline.py) ─────────
function layout() { let x = 0; return doc.clips.map((c) => { const d = (c.out - c.in) / doc.speed; const r = { c, start: x, end: x + d }; x += d; return r; }); }
function total() { const L = layout(); return L.length ? L[L.length - 1].end : 0; }
function locate(t) { const L = layout(); for (const r of L) if (t >= r.start && t < r.end) return { r, st: r.c.in + (t - r.start) * doc.speed }; const r = L[L.length - 1]; return r ? { r, st: r.c.out } : null; }
// слово попадает в тот кусок, где его середина: разрез посреди слова не удваивает его в субтитрах
// ключ слова — файл, номер слова и номер повтора: две копии одного куска не делят субтитры
function finalWords() {
  const out = []; const seen = {};
  for (const r of layout()) {
    SOURCES[r.c.src].words.forEach((w, i) => {
      const mid = (w.t0 + w.t1) / 2; if (mid < r.c.in || mid >= r.c.out) return;
      const a = Math.max(w.t0, r.c.in), b = Math.min(w.t1, r.c.out);
      const base = r.c.src + ':' + i; const n = seen[base] = (seen[base] ?? -1) + 1;
      out.push({ w: w.w, key: n ? base + '#' + n : base, t0: r.start + (a - r.c.in) / doc.speed, t1: r.start + (b - r.c.in) / doc.speed, clip: r.c.id });
    });
  }
  return out;
}
// группы субтитров; исправленная группа держит свои слова вместе, как бы ни менялась разбивка
function subGroups() {
