# Готовый исходник задачи (engine/vm/source.py): как только у задачи появился job.json (страница запустила анализ),
# видео Павла из черновика job-<id> приводятся к 1080×1920, 30 к/с, SDR тем же движком, что в сессии, и исходник
# ложится в тот же черновик. Сессии render и fix берут его вместо 4K-видео (vm fetch) и не нормализуют заново: на
# 4,4 минуты видео это 5–8 минут каждой сессии. Ключ — видео и озвучка задачи: «Повторить без озвучки» меняет job.json,
# и здесь делается новый исходник; есть уже — выход через полминуты. Запускает только коммит запуска разбора (`if` у
# задачи ниже): запуски монтажа и правок машину не поднимают. Вручную — заново после сбоя (метка
# source-<ключ>.failed): берётся ветка задачи, её движок и этот же скрипт; у задачи до этого workflow скрипта нет.
name: job-source
on:
  push:
    branches: ['claude/job-*']
    paths: ['jobs/*/job.json']
  workflow_dispatch:
    inputs:
      job:
        description: 'id задачи, например 261012-091256-w7eu'
        required: true
permissions:
  contents: write
concurrency:  # пуши и ручной запуск одной задачи — в одной очереди
  group: job-source-${{ inputs.job && format('claude/job-{0}', inputs.job) || github.ref_name }}
  cancel-in-progress: false
jobs:
  source:
    # готовый исходник нужен один раз: его делает запуск разбора («web(<id>): analyze #N» — коммит страницы с job.json).
    # Остальные коммиты job.json (запуски монтажа и правок, ссылка на сессию — «… — сессия») машину не поднимают: так
    # не тратятся минуты Actions — каждый запуск, даже на 10 с, считается минутой
    if: >-
      github.event_name == 'workflow_dispatch' || (contains(github.event.head_commit.message, ': analyze #')
      && !contains(github.event.head_commit.message, '— сессия'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:  # вручную — ветка задачи: её job.json, её движок (ключ исходника считает он)
          ref: ${{ inputs.job && format('claude/job-{0}', inputs.job) || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Normalize the job's videos once, into its draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          JOB: ${{ inputs.job }}
        run: bash .github/scripts/job-source.sh
