        <span style="font-size: 14px; font-weight: 600">IMG_4790.MOV</span>

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6D3BFF","options":["#6D3BFF","#1F6FEB","#0D7A6D","#D6246E"]},"$preview":{"width":390,"height":1340}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#6D3BFF';
    const light = this.lum(accent) > 0.18;
    const ok = /^#[0-9a-fA-F]{6}$/.test(accent);
    return {
      accent: accent,
      onAccent: light ? '#1D1640' : '#FFFFFF',
      accentText: light ? '#1D1640' : accent,
      accentSoft: ok ? accent + '1F' : 'rgba(109,59,255,0.12)',
      accentShadow: ok ? accent + '55' : 'rgba(109,59,255,0.33)'
    };
  }
  lum(hex) {
    const h = String(hex).replace('#', '');
    if (h.length !== 6) return 0;
    const c = [0, 2, 4].map((i) => {
      const v = parseInt(h.slice(i, i + 2), 16) / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
}
</script>
