# Готовые файлы задачи (ролик, субтитры) сессия Claude пушит в ветку claude/job-<id>,
# в папку jobs/<id>/out/. Переносит их в черновик релиза job-<id> сама страница (web/lib/outputs.ts), когда её
# открыли: Action стоил минут, а кончились минуты — ролик не доходил (26.10). Этот workflow — запасной, вручную на ветке
# задачи (Run workflow → ветка claude/job-<id>): то же самое — склеить части <имя>.part-aa…, перенести, убрать из ветки,
# записать released.json. Подробности: docs/spikes/2026-10-results.md.
name: job-outputs
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: job-outputs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Move job outputs to draft releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/move-job-outputs.sh
