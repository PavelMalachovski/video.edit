# Проверки всего, что есть в репозитории: страница (тесты, типы, сквозной путь в Chromium и в Safari на iPhone), шаблон
# слоя (и что Safari рисует его так же, как рендер), движок (быстрые тесты и ruff; медленные — с моделями распознавания,
# поставленными тем же setup/cloud-setup.sh, что и облако), скрипты и сами workflow (shellcheck, actionlint), секреты
# во всей истории (gitleaks: токены — только на сервере) и известные уязвимости зависимостей страницы (npm audit).
# Минуты Actions (тариф Free — 2 000 в месяц, полный прогон — ~33 мин): на пуш в рабочую ветку — только быстрое
# (страница, скрипты и workflow, секреты: ~3 мин); на PR в master — тяжёлое по тому, что затронуто (ci-changes.sh:
# движок, шаблон, e2e); master после слияния не перепроверяется (это код PR); раз в неделю (что сломалось снаружи:
# зеркала apt, модели, браузеры) и вручную — всё. Правки только документации не проверяются.
name: ci
on:
  push:
    branches-ignore: ['master', 'claude/job-*', 'ci-screens/**']
    paths-ignore: ['docs/**', 'CLAUDE.md', 'legacy/**']
  pull_request:
    branches: [master]
    paths-ignore: ['docs/**', 'CLAUDE.md', 'legacy/**']
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
  PW_VERSION: 1.56.1
  # ruff — та же версия, что в облачном окружении: новые версии находят другое
  PY_PACKAGES: sherpa-onnx soundfile numpy jsonschema fonttools pytest onnxruntime pillow ruff==0.16.8

jobs:
  # что затронул PR (на пуше, по расписанию и вручную не нужно: там тяжёлое не идёт или идёт всё)
  changes:
    name: what the PR touches
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.diff.outputs.engine }}
      template: ${{ steps.diff.outputs.template }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: bash .github/scripts/ci-changes.sh "origin/$GITHUB_BASE_REF" >> "$GITHUB_OUTPUT"

  web:
    name: page — tests and types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  template:
    name: template — layer in Chromium
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.template == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ffmpeg (render-frames tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: bash .github/scripts/ci-playwright.sh
        env:
          PW_BROWSERS: chromium webkit
      - run: npm test
        working-directory: template
        env:
          REQUIRE_WEBKIT: '1' # «Safari ≈ Chromium» не пропускается молча

  engine:
    name: engine — fast tests and ruff
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.engine == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ffmpeg, espeak-ng, Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng >/dev/null
          # shellcheck disable=SC2086 # список пакетов — словами
          python -m pip install -q $PY_PACKAGES
          ffmpeg -hide_banner -version | head -1
      - name: VAD model (small; the speech models are for the slow tests)
        run: |
          mkdir -p ~/.cache/vm
          curl -sSL --retry 3 -o ~/.cache/vm/silero_vad.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
      - run: bash .github/scripts/ci-playwright.sh
      - run: python -m pytest -q -m "not slow"
        working-directory: engine
      - run: ruff check .
        working-directory: engine

  engine-slow:
    name: engine — slow tests with the speech models
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.engine == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ffmpeg, espeak-ng, Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng >/dev/null
          # shellcheck disable=SC2086 # список пакетов — словами
          python -m pip install -q $PY_PACKAGES
      - run: bash .github/scripts/ci-playwright.sh
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vm
          key: vm-models-${{ hashFiles('setup/cloud-setup.sh') }}
      - name: Models — setup/cloud-setup.sh, as in the cloud environment
        shell: bash  # явный bash — с pipefail: сбой установки не прячется за tee
        run: |
          bash setup/cloud-setup.sh | tee setup.log
          grep -E '^[A-Z_]+=' setup.log >> "$GITHUB_ENV"
      - run: python -m pytest -q -m slow
        working-directory: engine
        env:
          VM_RENDER_SHOTS: ${{ runner.temp }}/render-shots # листы кадров готовых роликов — для ci-screens/render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-sheets
          path: ${{ runner.temp }}/render-shots
          if-no-files-found: ignore
          retention-days: 3

  e2e:
    name: page — end to end in ${{ matrix.browser == 'webkit' && 'Safari (WebKit, iPhone)' || 'Chromium' }}
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: ffmpeg, the schema checker and what the engine's layer needs (e2e checks the frame against it)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python -m pip install -q jsonschema numpy soundfile
      - run: bash .github/scripts/ci-playwright.sh
        env:
          PW_BROWSERS: ${{ matrix.browser }}
      - run: npm ci
        working-directory: web
      - run: npm run e2e
        working-directory: web
        env:
          E2E_BROWSER: ${{ matrix.browser }}
          E2E_SHOTS: ${{ runner.temp }}/e2e-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screens-${{ matrix.browser }}
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore
          retention-days: 3

  # скриншоты e2e обоих браузеров и листы кадров готовых роликов (медленные тесты движка) — в ветки
  # ci-screens/<chromium|webkit|render>/<ветка>: их смотрит Claude после прогона PR или ручного (и на сбое — тоже);
  # право записи — только здесь, где не запускается ничего, кроме git
  screens:
    name: screenshots — branches ci-screens/<chromium|webkit|render>/<branch>
    needs: [e2e, engine-slow]
    # и на сбое (видно, где упало), но не в отменённом прогоне (его скриншоты старее следующего) и не в недельном
    if: >-
      ${{ !cancelled() && github.event_name != 'schedule' &&
      (contains(fromJSON('["success","failure"]'), needs.e2e.result) || contains(fromJSON('["success","failure"]'), needs.engine-slow.result)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/screens
      - env:
          BRANCH: ${{ github.head_ref || github.ref_name }} # в PR ref_name — «N/merge»
        run: |
          for browser in chromium webkit; do
            bash .github/scripts/publish-screens.sh "$RUNNER_TEMP/screens/e2e-screens-$browser" "ci-screens/$browser/$BRANCH"
          done
          bash .github/scripts/publish-screens.sh "$RUNNER_TEMP/screens/render-sheets" "ci-screens/render/$BRANCH"

  lint:
    name: scripts and workflows — shellcheck, actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -q shellcheck-py==0.11.0.1 actionlint-py==1.7.12.25
      - run: shellcheck -S warning setup/*.sh web/tests/e2e/run.sh .github/scripts/*.sh
      - run: actionlint
        env:
          SHELLCHECK_OPTS: -S warning

  secrets:
    name: secrets and dependencies — gitleaks, npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # вся история: токен, попавший в коммит, остаётся в ней и после удаления
          persist-credentials: false # чужому бинарнику токен задания не нужен
      - name: gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner -v .
      # уязвимости зависимостей — раз в неделю и вручную: новая находка в next не должна красить каждый пуш
      - name: npm audit (page, high and critical)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
